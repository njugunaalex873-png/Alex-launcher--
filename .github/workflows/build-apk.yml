name: Build Alex Launcher Android APK

on:
push:
branches: ["main", "master"]
pull_request:
branches: ["main", "master"]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "21"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Dependencies
    run: npm ci

  - name: Build Web App
    run: npm run build

  - name: Add or Sync Capacitor Android
    run: |
      if [ -d android ]; then
        npx cap sync android
      else
        npx cap add android
      fi

  - name: Patch Android Manifest for Home Launcher
    run: node scripts/patch-android.js

  - name: Verify Android Launcher Manifest
    run: |
      grep -E "android.intent.category.HOME|android.intent.action.MAIN" android/app/src/main/AndroidManifest.xml

  - name: Build Debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Verify APK Exists
    run: test -f android/app/build/outputs/apk/debug/app-debug.apk

  - name: Upload Android APK
    uses: actions/upload-artifact@v4
    with:
      name: alex-launcher-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
